<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CryptoHashes is a client-only hashing tool for MD5, NTLM, SHA, bcrypt, and Argon2 generation plus verification."
    />
    <script>
      (() => {
        const key = 'cryptohashes:theme';
        const storedPreference = window.localStorage.getItem(key);
        const theme =
          storedPreference === 'light' || storedPreference === 'dark'
            ? storedPreference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';

        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>CryptoHashes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
