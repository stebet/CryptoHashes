name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build site
        run: pnpm build

      - name: Check Cloudflare configuration
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_KEY }}" || {
            echo "Missing GitHub secret CLOUDFLARE_API_KEY.";
            exit 1;
          }
          test -n "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" || {
            echo "Missing GitHub repository variable CLOUDFLARE_ACCOUNT_ID.";
            exit 1;
          }

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_KEY }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          command: pages deploy ./dist --project-name=cryptohashes
